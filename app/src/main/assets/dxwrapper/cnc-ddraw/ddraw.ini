[ddraw]
; ═══════════════════════════════════════════════════════
;  قلعة بوكس — إعدادات cnc-ddraw الافتراضية
;  علاج الشاشة السوداء والرسوم المكسورة في ألعاب DirectDraw
;  (البروفايلات تُعدّل هذه القيم تلقائياً حسب اللعبة)
; ═══════════════════════════════════════════════════════

; الدقة: 0 = استخدام دقة اللعبة نفسها
width=0
height=0

; ملء الشاشة داخل جلسة Wine الافتراضية
fullscreen=true
windowed=false
maintas=false
adjmouse=false

; المُصيّر: auto يختار الأفضل | opengl أسرع للألعاب الكلاسيكية
renderer=auto
devmode=false
vsync=false
minfps=10
maxfps=60

; إصلاح مشاكل التركيز بين Wine وشاشة الهاتف
noactivateapp=false

; طريقة اعتراض استدعاءات DirectDraw (3 = الأكثر توافقاً)
hook=3

; ضبط سرعة الألعاب المرتبطة بتوقيت المعالج (0 = بلا حد)
maxgameticks=0

; منع تقييد اللعبة على نواة واحدة (يتولى قلعة بوكس التوجيه)
singlecpu=false
